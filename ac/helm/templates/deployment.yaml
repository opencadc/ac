{{- $containerPort := .Values.service.port -}}
{{- $ldapPasswordKey := .Values.ldap.proxyPassword.key | default "proxyPassword" -}}
apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    run: {{ .Release.Name }}-tomcat
    {{- include "ac.labels" . | nindent 4 }}
  name: {{ .Release.Name }}-tomcat
  namespace: {{ .Release.Namespace }}
spec:
  replicas: {{ default 1 .Values.replicaCount }}
  selector:
    matchLabels:
      run: {{ .Release.Name }}-tomcat
  template:
    metadata:
      labels:
        run: {{ .Release.Name }}-tomcat
        {{- include "ac.selectorLabels" . | nindent 8 }}
    spec:
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      serviceAccountName: {{ include "ac.serviceAccountName" . }}
      automountServiceAccountToken: {{ .Values.serviceAccount.automount }}
      {{- with .Values.application.nodeAffinity }}
      affinity:
        nodeAffinity:
          {{- toYaml . | nindent 10 }}
      {{- end }}
      {{- with .Values.podSecurityContext }}
      securityContext:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      initContainers:
        - name: merge-ac-config
          image: {{ .Values.volumeInit.image | quote }}
          imagePullPolicy: {{ .Values.volumeInit.imagePullPolicy }}
          command: ['sh', '-c']
          args:
            - |
              set -e
              cp -R /config-src/. /config-dst/
              LDAP_PASSWORD=$(tr -d '\n' < /ldap-secret/proxyPassword)
              printf '\nproxyPassword = %s\n' "$LDAP_PASSWORD" >> /config-dst/ac-ldap-config.properties
              {{- range $index, $client := .Values.oidc.clients }}
              OIDC_SECRET=$(tr -d '\n' < /oidc-secrets/client-{{ $index }})
              printf '\n%s.secret = %s\n' {{ required "oidc.clients[].name is required" $client.name | quote }} "$OIDC_SECRET" >> /config-dst/ac-oidc-clients.properties
              {{- end }}
              {{- with .Values.oidc.signingKeys.existingSecret }}
              cp /oidc-signing/oidc-rsa256-pub.key /config-dst/oidc-rsa256-pub.key
              cp /oidc-signing/oidc-rsa256-priv.key /config-dst/oidc-rsa256-priv.key
              {{- end }}
          volumeMounts:
            - name: config-source
              mountPath: /config-src
              readOnly: true
            - name: ldap-secret
              mountPath: /ldap-secret
              readOnly: true
            {{- if .Values.oidc.clients }}
            - name: oidc-secrets
              mountPath: /oidc-secrets
              readOnly: true
            {{- end }}
            {{- with .Values.oidc.signingKeys.existingSecret }}
            - name: oidc-signing
              mountPath: /oidc-signing
              readOnly: true
            {{- end }}
            - name: config-merged
              mountPath: /config-dst
          {{- with .Values.volumeInit.securityContext }}
          securityContext:
            {{- toYaml . | nindent 12 }}
          {{- end }}
      containers:
        - image: "{{ .Values.image.repository }}:{{ .Values.image.tag | default .Chart.AppVersion }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          name: {{ .Release.Name }}-tomcat
          resources:
            {{- toYaml .Values.application.resources | nindent 12 }}
          {{- $tomcatSC := merge (dict "allowPrivilegeEscalation" false) (.Values.securityContext | default dict) }}
          securityContext:
            {{- toYaml $tomcatSC | nindent 12 }}
          {{- with .Values.application.extraEnv }}
          env:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          ports:
            - name: http
              containerPort: {{ $containerPort }}
              protocol: TCP
          {{- with .Values.application.extraPorts }}
          {{- toYaml . | nindent 12 }}
          {{- end }}
          volumeMounts:
            - mountPath: /config
              name: config-merged
          {{- with .Values.application.extraVolumeMounts }}
          {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- with .Values.livenessProbe }}
          livenessProbe:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- with .Values.readinessProbe }}
          readinessProbe:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- with .Values.startupProbe }}
          startupProbe:
            {{- toYaml . | nindent 12 }}
          {{- end }}
      {{- with .Values.application.extraHosts }}
      hostAliases:
      {{- range $extraHost := . }}
        - ip: {{ $extraHost.ip }}
          hostnames:
            - {{ $extraHost.hostname }}
      {{- end }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      volumes:
        - name: config-source
          configMap:
            name: {{ .Release.Name }}-config
        - name: ldap-secret
          secret:
            secretName: {{ include "ac.ldapPasswordSecretName" . }}
            items:
              - key: {{ $ldapPasswordKey | quote }}
                path: proxyPassword
        {{- if .Values.oidc.clients }}
        - name: oidc-secrets
          projected:
            sources:
            {{- range $index, $client := .Values.oidc.clients }}
              - secret:
                  name: {{ required "oidc.clients[].secret.existingSecret is required" $client.secret.existingSecret }}
                  items:
                    - key: {{ $client.secret.key | default "secret" | quote }}
                      path: client-{{ $index }}
            {{- end }}
        {{- end }}
        {{- with .Values.oidc.signingKeys.existingSecret }}
        - name: oidc-signing
          secret:
            secretName: {{ . }}
            items:
              - key: {{ $.Values.oidc.signingKeys.publicKey | default "oidc-rsa256-pub.key" | quote }}
                path: oidc-rsa256-pub.key
              - key: {{ $.Values.oidc.signingKeys.privateKey | default "oidc-rsa256-priv.key" | quote }}
                path: oidc-rsa256-priv.key
        {{- end }}
        - name: config-merged
          emptyDir: {}
      {{- with .Values.application.extraVolumes }}
      {{- toYaml . | nindent 8 }}
      {{- end }}
