{{- range $client := .Values.oidc.clients }}
{{- $id := required "oidc.clients[].id is required" $client.id }}
{{- if contains "." $id }}
{{- fail "oidc.clients[].id must not contain a dot" }}
{{- end }}
{{ $id }}.description = {{ required "oidc.clients[].description is required" $client.description }}
{{- with $client.accessGroup }}
{{ $id }}.access-group = {{ . }}
{{- end }}
{{ $id }}.claims = {{ join " " (required "oidc.clients[].claims is required" $client.claims) }}
{{- if not (hasKey $client "signDocuments") }}
{{- fail "oidc.clients[].signDocuments is required" }}
{{- end }}
{{ $id }}.sign-documents = {{ $client.signDocuments }}
{{- end }}
