{{- range $client := .Values.oidc.clients }}
{{- with $client.description }}
{{ $client.name }}.description = {{ . }}
{{- end }}
{{- with $client.accessGroup }}
{{ $client.name }}.access-group = {{ . }}
{{- end }}
{{- with $client.claims }}
{{ $client.name }}.claims = {{ join " " . }}
{{- end }}
{{- if ne $client.signDocuments nil }}
{{ $client.name }}.sign-documents = {{ $client.signDocuments }}
{{- end }}
{{- end }}
